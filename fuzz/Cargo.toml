[package]
name = "lzma-turbo-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lzma-turbo = { path = "..", default-features = false }
# The SDK's own decoder, for `differential`; it is only there when the fuzz
# build has `LZMA_SDK` set, and the target compares the crate's two loops
# alone without it.
sdk-oracle = { path = "../tools/sdk-oracle" }
# The SDK's own encoder, for `encode_differential`, on the same terms: it is
# only there when the fuzz build has `LZMA_SDK` set, and the target does
# nothing without it.
sdk-encoder = { path = "../tools/sdk-encoder" }

# The fuzz targets run against both decode loops: the default carries the
# crate's own defaults (assembly where there is one), and `--no-default-
# features --features portable` fuzzes the portable Rust loop.
[features]
default = ["lzma-turbo/default"]
portable = ["lzma-turbo/std", "lzma-turbo/crc", "lzma-turbo/xz", "lzma-turbo/enc", "lzma-turbo/native-crypto"]

[[bin]]
name = "decode_lzma"
path = "fuzz_targets/decode_lzma.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_lzma2"
path = "fuzz_targets/decode_lzma2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_xz"
path = "fuzz_targets/decode_xz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_lzma2_mt"
path = "fuzz_targets/decode_lzma2_mt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_lzma2_at"
path = "fuzz_targets/decode_lzma2_at.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encode_round_trip"
path = "fuzz_targets/encode_round_trip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encode_differential"
path = "fuzz_targets/encode_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

[workspace]
