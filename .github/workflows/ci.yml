name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: lzma-turbo-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.1

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject committed fixtures or personal paths
        run: |
          set -eu
          if git ls-files -- 'bench/fixtures/*' | grep -v 'README.md' ; then
            echo "benchmark fixture bytes must never be committed" >&2
            exit 1
          fi
          # Small differential vectors live under tests/data;
          # anything else binary, or any single vector over 256 KiB, is a leak.
          if git ls-files | grep -E '\.(lzma|xz|7z|bin)$' | grep -v '^tests/data/' ; then
            echo "binary fixtures are generated, not tracked" >&2
            exit 1
          fi
          big="$(git ls-files -z -- tests/data | xargs -0 wc -c | awk '$1 > 262144 && $2 != "total"')"
          if [ -n "$big" ]; then
            echo "test vector too large: $big" >&2
            exit 1
          fi
      - name: Every committed vector is bytes, not text
        run: |
          set -eu
          # A vector Git thinks is text has its line endings rewritten on a
          # Windows checkout, and then the differential tests compare the
          # decoder against bytes no encoder ever produced. `.gitattributes`
          # marks the whole directory binary; this proves it still covers
          # every file in it.
          text="$(git ls-files --eol -- tests/data fuzz/corpus tests/golden.manifest \
            | grep -v '\.gitignore$' | awk '$3 != "attr/-text"')"
          if [ -n "$text" ]; then
            echo "these vectors are not marked binary in .gitattributes:" >&2
            echo "$text" >&2
            exit 1
          fi

  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo doc --locked --workspace --no-deps --all-features

  test:
    name: test-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-aarch64
            runner: macos-15
          - platform: windows-x86_64
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install the xz the container tests are written against
        if: runner.os == 'Linux'
        run: ./.github/scripts/install-xz.sh
      # The default features now include `crypto`, which builds AWS-LC, so
      # this lane needs CMake - present on all four runners - and, on Windows
      # x86-64, an assembler for the NASM sources. `aws-lc-sys` is pulled with
      # its `prebuilt-nasm` feature and without `fips`, which is exactly the
      # combination its README says ships prebuilt NASM objects for Windows
      # x86-64, so no NASM install is needed; it would only be used if one
      # happened to be on PATH. That is why there is no setup-nasm step here
      # and why Windows no longer skips the default build.
      - name: Test with the assembly decode loop (default)
        run: cargo test --locked --workspace --no-fail-fast
      - name: Test with the portable decode loop
        run: cargo test --locked -p lzma-turbo --no-default-features --features std --no-fail-fast
      - name: Test without std
        run: cargo test --locked -p lzma-turbo --no-default-features --no-fail-fast
      # The pure-Rust crypto backend on its own: no C toolchain involved, and
      # the shape a consumer that wants none uses.
      - name: Test the RustCrypto backend alone
        run: cargo test --locked -p lzma-turbo --no-default-features --features std,native-crypto --no-fail-fast
      # Both backends compiled at once, which is what runs the differential
      # test between them.
      - name: Test both crypto backends against each other
        run: cargo test --locked -p lzma-turbo --features native-crypto --no-fail-fast
      # The encoder with nothing else turned on: no container, no crypto
      # backend, no assembly. `enc` implies `crc`, because the match finder's
      # byte table is the reflected CRC-32 table and is derived from
      # `crate::crc` rather than built again, and `crc` implies `std`; this is
      # the smallest build the encoder has.
      - name: Test the encoder alone
        run: cargo test --locked -p lzma-turbo --no-default-features --features enc --no-fail-fast
      # The encoder behind the .xz writer, with no SHA-256 backend. It is a
      # `check` rather than a `test` because that feature set cannot decode
      # one of the committed vectors - `mixed.sha256.xz` carries check type 10
      # and no backend is compiled in to compute it - which is true with or
      # without `enc` and is not this lane's business to paper over. What the
      # lane is for is that the combination compiles.
      - name: Check the encoder with the .xz writer and no crypto backend
        run: cargo check --locked -p lzma-turbo --no-default-features --features enc,xz --all-targets
      - name: Test the encoder with the .xz writer
        run: cargo test --locked -p lzma-turbo --no-default-features --features enc,xz,native-crypto --no-fail-fast
      # The one check that is not per platform: the parity tests compare this
      # crate with an SDK built on the same runner, and would go on passing if
      # both drifted together. These digests are written down once and compared
      # on all four.
      - name: The encoder's bytes are the committed digests
        run: cargo xtask golden --check

  wasm:
    name: wasm-${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The whole crate without std: the decoder alone, no dependencies.
          - lane: no-std
            features: ""
          # Everything wasm can have: the decoder, the .xz container, the
          # filters and the checks. `asm` is accepted and inert there (wasm
          # runs the portable loop) and SHA-256 has to come from RustCrypto,
          # because the default `crypto` feature builds AWS-LC's C.
          - lane: std-crc-crypto-xz
            features: "std,asm,crc,native-crypto,xz"
          # The same set with both bulk primitives delegated to the embedding
          # host (see src/hooks.rs): a wasm guest has no carry-less multiply
          # and no SHA extension, so this is the build an embedder ships.
          - lane: std-host-hooks-xz
            features: "std,asm,crc-host,crypto-host,xz"
          # The same two sets with the encoder in. `enc` is the port of
          # LzFind.c, LzmaEnc.c and Lzma2Enc.c: it allocates, it has no I/O of
          # its own, and its threaded paths are behind `std` and simply do not
          # start on a guest with no threads, so a wasm build of it is a build
          # anybody embedding a compressor wants.
          - lane: std-crc-crypto-xz-enc
            features: "std,asm,crc,native-crypto,xz,enc"
          - lane: std-host-hooks-xz-enc
            features: "std,asm,crc-host,crypto-host,xz,enc"
          # Each host feature alone, because they are independent: a
          # `crc-host` build must never need the SHA-256 hooks, or the reverse.
          - lane: crc-host-only
            features: "std,crc-host"
          - lane: crypto-host-only
            features: "std,crypto-host"
          # The converters alone, as a 7z reader takes them: no std, no xz.
          # That includes BCJ2, which is 7z's and has no xz filter id.
          - lane: filters-only
            features: "filters"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - name: Check for wasm32-unknown-unknown
        run: |
          set -eu
          if [ -n "${{ matrix.features }}" ]; then
            cargo check --locked -p lzma-turbo --target wasm32-unknown-unknown \
              --no-default-features --features "${{ matrix.features }}"
          else
            cargo check --locked -p lzma-turbo --target wasm32-unknown-unknown \
              --no-default-features
          fi

  # A `cargo check` proves the delegating build compiles; this job proves it
  # DECODES. It builds the reference embedding in examples/ for
  # `wasm32-wasip1`, runs it under a native `wasmtime` that supplies the host
  # CRC-32, CRC-64/XZ and streaming SHA-256, and requires its report to equal
  # the native decoder's byte for byte - plus the companion case, where a guest
  # with no hooks installed must panic with the documented message rather than
  # quietly checksumming in-guest. Ubuntu's runner image ships rustup, so the
  # wasip1 std is one `target add` away; without it the tests self-skip, which
  # is why the target is installed explicitly rather than left to chance.
  wasm-conformance:
    name: wasm-conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-wasip1
      - name: The wasip1 std must really be present, not merely nameable
        run: |
          set -eu
          rustup target add wasm32-wasip1
          libdir="$(rustc --print target-libdir --target wasm32-wasip1)"
          test -d "$libdir" || { echo "no wasm32-wasip1 std at $libdir" >&2; exit 1; }
      - name: Decode an .xz of each check type through host hooks
        run: |
          cargo test --locked -p lzma-turbo --features crc-host,crypto-host \
            --test wasm_host_conformance

  msrv:
    name: msrv
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read rust-version from the crate manifest
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo check --locked -p lzma-turbo --all-features

  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Verify the crates.io archive builds and carries no fixtures
        run: |
          set -eu
          # The listing goes outside the working tree, because the
          # `cargo package` below refuses to run in a dirty one.
          list="$RUNNER_TEMP/package-list.txt"
          cargo package --locked -p lzma-turbo --list > "$list"
          if grep -E '\.(lzma|xz|7z|bin)$' "$list" | grep -v '^tests/data/' ; then
            echo "fixture bytes leaked into the crate archive" >&2
            exit 1
          fi
          cargo package --locked -p lzma-turbo

  # The decode loops under src/lzma/decode_opt/ are hand translations of the
  # LZMA SDK's assembly. This job proves each shipped loop is the SDK's code:
  # it assembles the SDK's own files with the assemblers 7-Zip builds them
  # with, compiles the crate for every target that carries a loop, and
  # compares the two functions (byte for byte on arm64, instruction for
  # instruction on x86-64). Each runner brings the assemblers native to it.
  # See docs/asm-trust.md.
  asm-provenance:
    name: asm-provenance-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # JWasm is the SDK's Linux x86 assembler; clang its arm64 one.
          - platform: linux-x86_64
            runner: ubuntu-24.04
            targets: >-
              aarch64-unknown-linux-gnu aarch64-apple-darwin aarch64-pc-windows-msvc
              x86_64-unknown-linux-gnu x86_64-apple-darwin x86_64-pc-windows-msvc
          # GCC's assembler as a second, non-LLVM opinion on arm64.
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-gnu aarch64-apple-darwin aarch64-pc-windows-msvc
          # Microsoft's ml64, which the SDK's Windows build uses.
          - platform: windows-x86_64
            runner: windows-2025
            targets: x86_64-unknown-linux-gnu x86_64-apple-darwin x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Standard libraries for every target checked
        run: rustup target add ${{ matrix.targets }}
      - name: Fetch the pinned LZMA SDK
        run: cargo xtask sdk "$RUNNER_TEMP/lzma-sdk"
      - name: Choose the reference assemblers
        id: assemblers
        run: |
          set -euo pipefail
          args=()
          case "${{ matrix.platform }}" in
            linux-x86_64)
              jwasm="$(cargo xtask jwasm "$RUNNER_TEMP/jwasm")"
              args+=(--arm64-cc clang --x86 "jwasm=$jwasm")
              ;;
            linux-aarch64)
              args+=(--arm64-cc gcc)
              if command -v clang >/dev/null; then args+=(--arm64-cc clang); fi
              ;;
            windows-x86_64)
              vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
              ml64="$("$vswhere" -latest -products '*' -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/ml64.exe' | head -n1)"
              test -n "$ml64"
              args+=(--x86 "ml64=$ml64")
              ;;
          esac
          for target in ${{ matrix.targets }}; do args+=(--target "$target"); done
          printf '%s\n' "${args[@]}" > "$RUNNER_TEMP/provenance-args"
      - name: Compare every shipped loop with the SDK's
        run: |
          set -euo pipefail
          mapfile -t args < "$RUNNER_TEMP/provenance-args"
          cargo run --locked --release -p asm-provenance -- \
            --sdk "$RUNNER_TEMP/lzma-sdk" "${args[@]}"

  # The crate's two loops against the SDK's C and assembly ones, call for call,
  # over the vectors, their truncations, corrupt copies and noise. macOS has
  # no SDK assembly (its arm64 file does not assemble for Mach-O), so it
  # compares three decoders; everywhere else the build must have all four.
  sdk-oracle:
    name: sdk-oracle-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            require_asm: "1"
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            require_asm: "1"
          - platform: macos-aarch64
            runner: macos-15
            require_asm: "0"
          - platform: windows-x86_64
            runner: windows-2025
            require_asm: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Fetch the pinned LZMA SDK
        run: cargo xtask sdk "$RUNNER_TEMP/lzma-sdk"
      - name: Build JWasm for the SDK's x86 assembly
        if: matrix.platform == 'linux-x86_64'
        run: echo "LZMA_ORACLE_ASSEMBLER=$(cargo xtask jwasm "$RUNNER_TEMP/jwasm")" >> "$GITHUB_ENV"
      - name: Four decoders, one answer
        env:
          LZMA_ORACLE_REQUIRE: "1"
          LZMA_ORACLE_REQUIRE_ASM: ${{ matrix.require_asm }}
        run: LZMA_SDK="$RUNNER_TEMP/lzma-sdk" cargo test --locked -p sdk-oracle

  # What a sanitizer cannot give the assembly loop. `guard_pages` puts every
  # allocation and every input slice against a no-access page, on each OS -
  # for the decode loops and, since 0.4.0, for the encoder's window, tables and
  # range buffer too; Valgrind's memcheck, which instruments the machine code
  # itself and so sees inside the loop, runs the asm-against-portable suite and
  # the encoder suites on Linux.
  memory-safety:
    name: memory-safety-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # Longer than the other trust jobs on purpose: memcheck costs a large
    # constant factor, and the encoder lanes below are inside it. The corpus
    # cap is what keeps that factor affordable; widening this instead would be
    # the wrong knob.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-aarch64
            runner: macos-15
          - platform: windows-x86_64
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Every buffer against a guard page
        run: cargo test --locked -p lzma-turbo --test guard_pages -- --include-ignored
      - name: Install Valgrind
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind
      - name: Both loops under Valgrind
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: valgrind -q --error-exitcode=1
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: valgrind -q --error-exitcode=1
        run: cargo test --locked -p lzma-turbo --test asm_parity
      # The encoder's oracles, so the lanes below are the real parity sweep
      # under memcheck rather than a round trip. The oracle binaries are
      # separate processes and run at full speed; Valgrind traces the test
      # binary only.
      - name: Build the reference encoder from the pinned SDK
        if: runner.os == 'Linux'
        run: cargo xtask lzma-util
      # The encoder under memcheck. It owns almost everything it touches - the
      # match finder's window and tables, the parser's `opt` array, the range
      # encoder's buffer - and three threads share the first of those in
      # `LzFindMt.c`, which is exactly what an instrumented run is for.
      #
      # `LZMA_TURBO_CORPUS_MAX` is why this fits: memcheck costs tens of times
      # native, and the generated corpus runs to 300 KiB a case. Capped at
      # 16 KiB the sweep keeps every setting, every match finder and every
      # thread count and loses only the long inputs, which the uncapped
      # `encoder-parity` job runs on all four platforms anyway.
      - name: The encoder under Valgrind
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: valgrind -q --error-exitcode=1
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: valgrind -q --error-exitcode=1
          LZMA_TURBO_LZMA_UTIL_REQUIRE: "1"
          LZMA_TURBO_CORPUS_MAX: "16384"
        run: |
          cargo test --locked --release -p lzma-turbo \
            --test mt_match_finder --test lzma_parity --test lzma2_mt_parity
      - name: The encoder's unit tests under Valgrind
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: valgrind -q --error-exitcode=1
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: valgrind -q --error-exitcode=1
        run: "cargo test --locked --release -p lzma-turbo --lib -- enc::"

  # The data races a guard page cannot see. `LzFindMt.c` is three threads over
  # one window and one pair of ring buffers, partitioned by nothing but the
  # SDK's own handshake, and `MtCoder.c` hands blocks between workers on a
  # semaphore and a read token; ThreadSanitizer is what proves the handshake is
  # really what makes those accesses disjoint. Nightly with `-Zbuild-std`,
  # because the standard library has to be instrumented too or every
  # synchronisation edge inside it is invisible and the run is all false
  # positives. The nightly is pinned exactly as fuzz.yml pins its own.
  thread-sanitizer:
    name: thread-sanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TSAN_TOOLCHAIN: nightly-2026-09-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-09-01
          targets: x86_64-unknown-linux-gnu
          components: rust-src
      - name: The threaded encoder and decoder under ThreadSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=thread
          # The default features build AWS-LC, whose assembly TSan cannot see
          # into and which would report races it has no annotations for. None
          # of it is under test here.
          TSAN_OPTIONS: halt_on_error=1
          # A three-megabyte input instrumented at every memory access is
          # minutes a case; the threads and their handshakes are what is under
          # test, not the volume.
          LZMA_TURBO_CORPUS_MAX: "16384"
        run: |
          cargo "+$TSAN_TOOLCHAIN" test -Zbuild-std \
            --target x86_64-unknown-linux-gnu \
            --no-default-features --features std,crc,xz,enc,native-crypto \
            -p lzma-turbo --test mt_match_finder --test lzma2_mt_parity --test mt

  # Two minutes of the differential fuzz target per assembly architecture;
  # the nightly schedule in fuzz.yml runs it for half an hour.
  # Every committed vector and fuzz seed is what `cargo xtask vectors` makes
  # from sources it generates, with the xz the container tests pin; a blob
  # that file does not explain does not get in.
  vectors:
    name: vectors
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install the pinned xz
        run: ./.github/scripts/install-xz.sh
      - name: Regenerate and compare
        run: cargo xtask vectors --check

  # XZ Utils' own decoder test files, fetched from the pinned release and
  # checked file by file against tests/xz-utils.manifest, through every reader.
  xz-utils-suite:
    name: xz-utils-suite-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-aarch64
            runner: macos-15
          - platform: windows-x86_64
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Fetch the XZ Utils test files
        run: cargo xtask xz-tests
      - name: Every verdict the README gives
        env:
          LZMA_TURBO_XZ_TESTS_REQUIRE: "1"
        run: cargo test --locked -p lzma-turbo --test xz_utils

  encoder-parity:
    name: encoder-parity-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-aarch64
            runner: macos-15
          - platform: windows-x86_64
            runner: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # The external-decode tests compare this crate's output with what `xz`
      # and 7-Zip make of it. Both are installed on every platform here, and
      # required below rather than skipped: the `.xz` frame is the one part of
      # the writer with no parity oracle, so an external reader that silently
      # did not run is the difference between proving it and not.
      - name: Install the xz the container tests are written against
        run: ./.github/scripts/install-xz.sh
      - name: Install the pinned 7-Zip
        run: echo "LZMA_TURBO_7ZZ=$(cargo xtask sevenzip | tail -n1)" >> "$GITHUB_ENV"
      # `cargo xtask lzma-util` builds LzmaUtil, the props-driven oracles --
      # including the LZMA1 and LZMA2 ones built without `Z7_ST`, which are the
      # only builds that have `MtCoder.c` and `LzFindMt.c` in them -- and the
      # filter oracle
      # from the pinned SDK sources with gcc-style flags. The Windows image has
      # MinGW's gcc but no `cc`.
      - name: Build the reference encoder from the pinned SDK
        env:
          CC: ${{ runner.os == 'Windows' && 'gcc' || 'cc' }}
        run: cargo xtask lzma-util
      # The encoder must be bit-exact with the reference at every setting, so
      # a missing oracle is a failure here rather than a skip.
      - name: Bit-exact with the reference encoder
        env:
          LZMA_TURBO_LZMA_UTIL_REQUIRE: "1"
        run: cargo test --locked --release -p lzma-turbo --test lzma_parity --test lzma2_encoder
      # The threaded encoder has to agree with the threaded reference, and
      # with itself at every thread count.
      - name: Bit-exact with the multi-threaded reference encoder
        env:
          LZMA_TURBO_LZMA_UTIL_REQUIRE: "1"
        run: cargo test --locked --release -p lzma-turbo --test lzma2_mt_parity --test mt_match_finder
      # Same rule for the BCJ, BCJ2 and delta converters, both directions.
      - name: Bit-exact with the reference filters
        env:
          LZMA_TURBO_LZMA_UTIL_REQUIRE: "1"
        run: cargo test --locked --release -p lzma-turbo --test filter_parity --test bcj2_parity
      - name: The .xz writer through every reader, and through xz and 7-Zip
        env:
          LZMA_TURBO_XZ_REQUIRE: "1"
          LZMA_TURBO_7ZZ_REQUIRE: "1"
        run: cargo test --locked --release -p lzma-turbo --test xz_encoder

  # A fuzz target is in its own workspace under `fuzz/`, so `cargo test`,
  # `cargo clippy` and `cargo doc` never build one: an API change can leave a
  # target uncompilable and nothing says so until someone fuzzes. This builds
  # every one of them and runs none, in a couple of minutes.
  fuzz-check:
    name: fuzz-check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FUZZ_TOOLCHAIN: nightly-2026-09-01
      CARGO_FUZZ_VERSION: 0.13.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-09-01
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      # With the SDK, so the two differential targets are built with their
      # oracles in rather than in the shape that compares the crate with
      # itself.
      - name: Fetch the pinned LZMA SDK
        run: cargo "+$FUZZ_TOOLCHAIN" xtask sdk "$RUNNER_TEMP/lzma-sdk"
      - name: Every fuzz target builds
        env:
          LZMA_ORACLE_REQUIRE: "1"
          # The encoder oracle too: `encode_differential` links the SDK's
          # encoder, and a build without it would compile to a target that
          # returns immediately.
          LZMA_ENCODER_ORACLE_REQUIRE: "1"
        run: LZMA_SDK="$RUNNER_TEMP/lzma-sdk" cargo xtask fuzz-check

  fuzz-differential:
    uses: ./.github/workflows/fuzz.yml
    with:
      seconds: 120

  ci-complete:
    name: ci-complete
    if: always()
    needs: [hygiene, fmt, clippy, docs, test, wasm, wasm-conformance, msrv, package, asm-provenance, sdk-oracle, memory-safety, thread-sanitizer, vectors, xz-utils-suite, encoder-parity, fuzz-check, fuzz-differential]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fail if any required lane failed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            exit 1
          fi
