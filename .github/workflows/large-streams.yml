name: large-streams

# The >4 GiB streams in tests/large_streams.rs: through the encoder, the
# sequential reader, the parallel reader, the adaptive decoder and the system
# `xz`. They are `#[ignore]`d in the ordinary suite for their run time, so
# they run here, weekly and on demand. ubuntu-24.04 ships xz-utils, which is
# the independent decoder the tests call; nothing is downloaded for it.
on:
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.1

jobs:
  large-streams:
    name: large-streams
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: The system xz is present
        run: xz --version
      - name: Streams past 4 GiB through every decoder and xz
        run: cargo test --locked --release -p lzma-turbo --test large_streams -- --include-ignored --test-threads=1
