[package]
name = "xtask"
description = "Repository tasks: `cargo xtask release`"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
publish = false

# Kept to as close to nothing as possible: this has to build on a fresh clone,
# on any host, before anything else does. `sha2` is here because checking a
# downloaded tarball against a pinned digest is hashing, and hashing belongs in
# a hash library rather than in a hand-written one.
[dependencies]
sha2 = { version = "0.11.0", default-features = false }
