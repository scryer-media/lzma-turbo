[package]
name = "lzma-turbo"
description = "LZMA and LZMA2 decoding in Rust, ported from the 7-Zip reference decoder for its speed"
readme = "README.md"
version = "0.5.0"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-or-later"
repository = "https://github.com/scryer-media/lzma-turbo"
keywords = ["lzma", "lzma2", "xz", "decompression"]
categories = ["compression", "no-std"]
# Repository scaffolding that has no business in the crate archive.
exclude = [
    ".github/", ".githooks/", ".gitleaks.toml", ".gitattributes", "renovate.json", "AGENTS.md",
    "asm-lab/", "bench/", "docs/", "fuzz/", "tools/", "xtask/", ".cargo/", "rust-toolchain.toml",
    # The tests share a helper with `tools/lzma-bench` and read repository
    # fixtures, so they only build from a checkout.
    "tests/",
]

[features]
default = ["std", "asm", "crc", "crypto", "xz", "enc"]
std = ["crc-fast?/std"]
# The hand-written decode loops ported from the LZMA SDK's Asm/ tree, used on
# aarch64 and x86_64. Turning it off falls back to the portable Rust port of
# the C loop, which is what every other target gets anyway.
asm = []
# CRC-32 and CRC-64/XZ from `crc-fast`, which uses the carry-less multiply
# units. Default because every xz stream carries one of them (check types 1
# and 4); the decoder itself never touches either.
crc = ["std", "dep:crc-fast"]
# The BCJ and delta converters on their own: `no_std`, no dependency. They
# are xz's filters, but 7z carries the same ones under the same ids, so a 7z
# reader wants them without the container below.
filters = []
# The .xz container: stream framing, block headers, the index, the checks and
# the readers over them. Implies `filters`, and re-exports them at `xz::bcj`
# and `xz::delta`. Needs `crc`, because every xz header carries a mandatory
# CRC-32, and `std`, because the readers are I/O.
xz = ["std", "crc", "filters"]
# The encoder: the port of the SDK's LzFind.c, LzmaEnc.c and Lzma2Enc.c, plus
# the .lzma and .xz writers over it. It needs `crc`, because the match
# finder's byte table is the standard reflected CRC-32 table and is derived
# from `crate::crc` rather than built again; the .xz writer's checks come from
# there too. Default, alongside `crc`.
enc = ["crc"]
# SHA-256, which is xz check type 10, over AWS-LC. Default, so that the
# obvious build gets the fast, audited implementation.
crypto = ["std", "dep:aws-lc-rs"]
# The same API over RustCrypto's `sha2`, for a build that wants no C
# toolchain. It takes precedence when both are on, so
# `--no-default-features --features std,native-crypto` is the pure-Rust
# choice, and a build with both compiles both and checks they agree.
native-crypto = ["dep:sha2"]
# Hand the bulk CRC-32 and CRC-64/XZ to an embedder-installed hook (see the
# `hooks` module) instead of computing them here. Engaged on `wasm32` ONLY: on
# a native target the feature is accepted but inert, so feature unification in
# a mixed workspace cannot silently turn a native build into a delegating one.
# It adds no dependency - `crc-fast` stays, because the checksum *combine* is
# arithmetic rather than a pass over data and is never delegated - and it
# implies `crc`, whose API it reimplements rather than replaces.
crc-host = ["crc"]
# The same for SHA-256, the xz check type 10 hash, delegated as a streaming
# handle. It implies `native-crypto`, so a native build of a `crypto-host`
# crate always has an in-process backend, and `std`, because the hook registry
# is a `std::sync::RwLock`.
crypto-host = ["std", "native-crypto"]
# Measurement only, never default. It puts a cached toggle in front of each
# kernel that replaced a loop from the C, so that the A/B behind the change is
# one binary with one branch - in the position a target-feature probe's cached
# bool would sit - rather than two builds whose inlining and layout differ at
# the couple of percent the comparison is written in. The toggles are
# `LZMA_TURBO_MATCH_RUN`, `LZMA_TURBO_BCJ_SCAN` and `LZMA_TURBO_DELTA`, each
# taking `scalar` for the loop the kernel replaced. Without the feature the
# shipped build has neither the branch nor the environment lookup. See
# `src/kernel_ab.rs` and `docs/simd-kernels-report.md`.
kernel-ab = ["std", "enc", "xz"]

[dependencies]
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"], optional = true }
crc-fast = { version = "1.10.0", default-features = false, optional = true }
sha2 = { version = "0.11.0", default-features = false, optional = true }

# The wasm conformance harness drives the guest examples below through a
# native `wasmtime` that supplies the reference host functions they import.
# Those are native-only tooling for that one test: they never reach the crate's
# own graph, and they must stay off the wasm example build (wasmtime does not
# build for wasm), hence the target gate.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
wasmtime = "48"
wasmtime-wasi = "48"
# The host side of the reference embedding checksums with the same libraries
# the native build of this crate does: no hand-written CRC or SHA on either
# side of the boundary.
crc-fast = { version = "1.10.0", default-features = false, features = ["std"] }
sha2 = { version = "0.11.0" }

# The two wasm guest examples are reference embeddings of the `hooks` seam:
# each declares raw imports in a `host` namespace and installs hooks that
# forward to them. They only mean anything with the delegating features on.
[[example]]
name = "wasm_xz_conformance"
required-features = ["crc-host", "crypto-host", "xz"]

[[example]]
name = "wasm_missing_hooks"
required-features = ["crc-host", "crypto-host"]

# `tools/lzma-bench` is a workspace member rather than an example because it
# depends on `lzma-rust2` and `liblzma` to time this crate against them, and
# those must not appear in this crate's own graph at all.
[workspace]
members = [
    "tools/asm-provenance",
    "tools/lzma-bench",
    "tools/sdk-encoder",
    "tools/sdk-oracle",
    "xtask",
]
resolver = "2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Benchmarks and profiling want symbols without giving up codegen.
[profile.profiling]
inherits = "release"
strip = false
debug = 1

# The tests decode real streams, and an unoptimized decoder is slow enough to
# change what the suite can cover: one exhaustive truncation test took over
# nineteen minutes on a CI runner, and five test invocations across five
# feature lanes did not fit a forty-minute budget. Only the optimizer is
# raised - `debug-assertions` and `overflow-checks` stay on, which is the part
# a debug build is run for. `test` inherits this, so both unit and integration
# tests get it.
[profile.dev]
opt-level = 2
